- clean: ['~', '~/.config/nvim']

- defaults:
    link:
      create: true
      relink: true

- link:
    ~/dotfiles: ''
    ~/.i3: i3/
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.ideavimrc: ideavimrc
    ~/.gvimrc: gvimrc
    ~/.bashrc: bashrc
    ~/.pdbrc.py: pdbrc
    ~/.eslintrc: eslintrc
    ~/.zshrc: zshrc
    ~/.zshenv: zshenv
    ~/.zprofile: zprofile
    ~/.ctags.d/typescript.ctags: ctags
    ~/.bash_profile: bash_profile
    ~/.config/nvim/init.lua: init.lua
    ~/.config/nvim/ginit.vim: gnvimrc
    ~/.config/kitty/kitty.conf: kitty
    ~/.config/tmuxinator:
      create: true
      path: tmuxinator

- shell:
  - [git submodule update --init --recursive, Installing submodules]
